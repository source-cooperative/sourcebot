name: Observability Digest

on:
  schedule:
    - cron: "0 16 * * 1" # Mondays 16:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Days to review (default: 7)"
        required: false
        type: number
      post:
        description: "Post to Slack (off prints the digest to the log only)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: write # keepalive below

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout sourcebot
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run digest
        run: npx tsx src/digest.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SC_DEV_BOT_APP_ID: ${{ vars.SC_DEV_BOT_APP_ID }}
          SC_DEV_BOT_PRIVATE_KEY: ${{ secrets.SC_DEV_BOT_PRIVATE_KEY }}
          SC_DEV_BOT_INSTALLATION_ID: ${{ vars.SC_DEV_BOT_INSTALLATION_ID }}
          SLACK_WEBHOOK_URL: ${{ (github.event_name == 'schedule' || inputs.post) && secrets.SLACK_WEBHOOK_URL || '' }}
          DIGEST_DAYS: ${{ inputs.days }}

      # GitHub disables scheduled workflows after 60 days without repository
      # activity (that stopped the monitor on 2026-10-10). Re-enabling them from
      # a scheduled run keeps them on.
      - name: Keep scheduled workflows enabled
        if: always()
        run: |
          gh workflow enable monitor.yml -R "$GITHUB_REPOSITORY"
          gh workflow enable digest.yml -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
